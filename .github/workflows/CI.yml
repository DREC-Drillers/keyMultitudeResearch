name: Nix CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release]
    steps:
      - uses: actions/checkout@v7
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Configure
        run: nix develop --command cmake --preset ${{ matrix.preset }}
      - name: Build
        run: nix develop --command cmake --build --preset ${{ matrix.preset }} --parallel 2
      - name: Test
        run: nix develop --command ctest --preset ${{ matrix.preset }}

  format:
    name: Check C++ formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Check formatting
        run: nix develop --command python3 scripts/code_quality.py format

  tidy:
    name: Analyze C++ with clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Configure compilation database
        run: nix develop --command cmake --preset quality
      - name: Analyze project sources
        run: nix develop --command python3 scripts/code_quality.py tidy --build-dir build/quality

  nix:
    name: Verify Nix package and installed consumer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix flake check --print-build-logs
