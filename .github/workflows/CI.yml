name: CMake CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (${{ matrix.os }}, ${{ matrix.preset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        preset: [debug, release]
    steps:
      - uses: actions/checkout@v7
      - name: Initialize MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 2
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  format:
    name: Check C++ formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install clang-format 18
        run: sudo apt-get update && sudo apt-get install --yes clang-format-18
      - name: Check formatting
        run: python3 scripts/code_quality.py format

  tidy:
    name: Analyze C++ with clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install LLVM 18
        run: sudo apt-get update && sudo apt-get install --yes clang-18 clang-tidy-18 ninja-build
      - name: Configure compilation database
        env:
          CXX: clang++-18
        run: cmake --preset quality
      - name: Analyze project sources
        run: python3 scripts/code_quality.py tidy --build-dir build/quality

  nix:
    name: Build pinned Nix package and run tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix flake check --print-build-logs

  package:
    name: Verify installed library
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Configure, build and install
        run: |
          cmake --preset library
          cmake --build --preset library
          cmake --install build/library
      - name: Build installed consumer
        run: |
          cmake -S tests/consumer -B build/consumer -G Ninja -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/build/install"
          cmake --build build/consumer
          ctest --test-dir build/consumer --output-on-failure --no-tests=error
